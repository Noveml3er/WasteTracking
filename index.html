<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBK Waste Tracking Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; padding: 15px; margin: 0; }
        .form-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 500px; border-top: 8px solid #00b959; box-sizing: border-box; }
        input, select, button {font-size: 16px !important; /* ป้องกัน iOS ซูมหน้าจอเองเวลาโฟกัสช่องกรอก */ }
        .header { text-align: center; margin-bottom: 25px; }
        .header h2 { color: #333; font-size: 1.4rem; margin: 10px 0; }
        .header p { color: #666; font-size: 0.9rem; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #444; }
        label span { color: red; }
        select, input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 1rem; }
        button { width: 100%; padding: 14px; background-color: #00b959; color: white; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background-color: #00b959; }
        .footer { text-align: center; margin-top: 20px; font-size: 0.8rem; color: #888; border-top: 1px solid #eee; padding-top: 15px; }
        .team-brand { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 5px; /* Space between logo and text */ margin-top: 5px; color: #888; }
        .team-brand img { height: 14px; /* Adjust this to make the logo smaller or larger */ width: auto; display: block; }
        .footer b { color: #555; }
    </style>
</head>
<body>

<div class="form-card">
    <div class="header">
        <div style="font-size: 2rem;">♻️</div>
        <h2>ระบบบันทึกน้ำหนักขยะ (Waste Tracking)<br>จุดคัดแยกที่ 1</h2>
        <p>กรุณากรอกข้อมูลหลังจากทำการชั่งน้ำหนักขยะ</p>
    </div>

    <form id="wasteForm">
        <div class="form-group">
            <label>User <span>*</span></label>
            <select name="user" required>
                <option value="">Select an option ...</option>
                <option value="Teanchai Gunponpai">Teanchai Gunponpai</option>
                <option value="Prinya Chuachang">Prinya Chuachang</option>
                <option value="Vipada Thongsuk">Vipada Thongsuk</option>
                </select>
        </div>

        <div class="form-group">
            <label>Shop</label>
            <select name="shop">
                <option value="">Select an option ...</option>
                <option value="KFC">KFC</option>
                <option value="Starbuck">Starbuck</option>
                <option value="Kate Teaw Boat Noodles">Kate Teaw Boat Noodles</option>
                <option value="Food Court">Food Court</option>
                <option value="KOI">KOI</option>
                <option value="RAWMAT">RAWMAT</option>
                <option value="Sushiro">Sushiro</option>
            </select>
        </div>

        <div class="form-group">
            <label>ประเภทขยะ <span>*</span></label>
            <select name="waste_type" required>
                <option value="">Select an option ...</option>
                <option value="เศษอาหาร">เศษอาหาร</option>
                <option value="กระดาษ">กระดาษ</option>
                <option value="พลาสติก">พลาสติก</option>
                <option value="โลหะ/แก้ว">โลหะ/แก้ว</option>
                <option value="ขยะทั่วไป">ขยะทั่วไป</option>
            </select>
        </div>

        <div class="form-group">
            <label>น้ำหนัก (กิโลกรัม) <span>*</span></label>
            <input type="number" name="weight" step="0.1" placeholder="0.0" required>
        </div>

        <button type="submit" id="submitBtn">Submit</button>
    </form>
    
    <div class="footer">
    <div class="team-brand">
        <span>This platform powered by</span>
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/83/JLL_logo.svg/1280px-JLL_logo.svg.png" alt="JLL Logo">
        <b>OBK JLL Tech Team</b>
    </div>
</div>

<script>
    const WEBHOOK_URL = 'https://noveml3er.app.n8n.cloud/webhook/tracking-form'; // <-- วาง URL ของ n8n Webhook ตรงนี้ค่ะ

    document.getElementById('wasteForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerText = 'Sending...';

        const formData = new FormData(e.target);
        const data = Object.fromEntries(formData.entries());
        
        // ดึง IP อัตโนมัติจาก API ภายนอก
        try {
            const ipRes = await fetch('https://api.ipify.org?format=json');
            const ipData = await ipRes.json();
            data.ip_address = ipData.ip;
        } catch (err) {
            data.ip_address = 'unknown';
        }

        data.submittedAt = new Date().toISOString();
        data.location = 'จุดคัดแยกที่ 1';

        // ส่งข้อมูลเข้า n8n Webhook
        fetch(WEBHOOK_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        })
        .then(response => {
            if (response.ok) {
                alert('บันทึกข้อมูลสำเร็จแล้วเจ้าค่ะ!');
                e.target.reset();
            } else {
                alert('เกิดข้อผิดพลาดในการส่งข้อมูลค่ะ');
            }
        })
        .catch(error => alert('Error: ' + error))
        .finally(() => {
            btn.disabled = false;
            btn.innerText = 'Submit';
        });
    });
</script>

</body>
</html>
